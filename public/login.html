<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Tick-IT</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#e6edf7;background:linear-gradient(160deg,#0b1630 0%,#0f2044 55%,#143060 100%)}
  .card{width:380px;background:#142647;border:1px solid #2a3f66;border-radius:8px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:34px;height:34px;border-radius:6px;background:#d9a13b;display:inline-flex;align-items:center;justify-content:center}
  .brand b{font-size:18px;display:block}.brand small{color:#94a5c0;font-size:12px}
  a.sso{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:4px;background:#d9a13b;color:#1f2732;font-weight:700;text-decoration:none}
  a.sso:hover{background:#e6b657}
  .sep{display:flex;align-items:center;gap:10px;margin:18px 0;color:#5b6d8f;font-size:12px}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:#2a3f66}
  label{display:block;font-size:12px;font-weight:700;color:#94a5c0;margin:12px 0 5px}
  input{width:100%;height:40px;border:1.5px solid #2a3f66;border-radius:4px;padding:0 12px;font:inherit;color:#e6edf7;background:#10203f;box-sizing:border-box;outline:none}
  input:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.35)}
  button{margin-top:14px;width:100%;height:40px;border:0;border-radius:4px;background:#233156;color:#cdd8ec;font:inherit;font-weight:700;cursor:pointer}
  button:hover{background:#2c3d68}
  button:disabled{background:#3a4f78;cursor:wait}
  .err{margin-top:12px;font-size:13px;color:#ff8a80;min-height:18px}
  .foot{margin-top:16px;font-size:12px;color:#7385a3;display:flex;align-items:center;gap:6px}.foot i{width:7px;height:7px;border-radius:50%;background:#3ec46f}
  details{margin-top:4px}
  summary{cursor:pointer;font-size:12px;color:#7385a3;user-select:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1f2732" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg></span><div><b>Tick-IT</b><small>Helpdesk divisi IT · Samudra Retail Indonesia</small></div></div>

  <a class="sso" id="ssoBtn" href="/login/voyage">Masuk dengan Voyage</a>
  <div class="foot"><i></i>Satu akun Voyage berlaku di semua app — TickIT, Hands, dll.</div>

  <div class="sep">atau</div>

  <details>
    <summary>Masuk pakai email TickIT (khusus kalau Voyage sedang tidak bisa diakses)</summary>
    <form id="f">
      <label>Email</label><input name="email" type="email" autocomplete="username" required>
      <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
      <button id="b">Masuk</button>
      <div class="err" id="err"></div>
    </form>
  </details>
</div>
<script>
  // Bawa ?next= yang sama ke tombol SSO, supaya sesudah login Voyage balik ke halaman yang dituju semula.
  (function () {
    const next = new URLSearchParams(location.search).get('next');
    if (next) document.getElementById('ssoBtn').href = '/login/voyage?next=' + encodeURIComponent(next);
  })();
  const f = document.getElementById('f'), b = document.getElementById('b'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); b.disabled = true; err.textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: f.email.value, password: f.password.value }) });
      if (!r.ok) throw new Error((await r.json()).message || 'Gagal masuk.');
      location.href = '/';
    } catch (x) { err.textContent = x.message; b.disabled = false; }
  });
</script>
</body>
</html>
